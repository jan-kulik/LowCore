# ╔══════════════════════════════════════════════════╗
# ║                LowCore Config                    ║
# ╚══════════════════════════════════════════════════╝
#  GENERAL INFORMATION
#  ──────────────────────────────────────────────────────────────────
#  This file controls all plugin messages, prefixes, and features.
#  Changes require either:
#     - /lowcore reload   (reloads the config)
#     - or a server restart
#
#  COLOR CODES
#  ──────────────────────────────────────────────────────────────────
#  You can use the following Minecraft color codes in all messages:
#     &0  Black            &8  Dark Gray
#     &1  Dark Blue        &9  Blue
#     &2  Dark Green       &a  Light Green
#     &3  Aqua             &b  Light Aqua
#     &4  Dark Red         &c  Red
#     &5  Purple           &d  Pink / Magenta
#     &6  Gold             &e  Yellow
#     &7  Gray             &f  White
#
#  Formatting codes:
#     &l  Bold             &n  Underlined
#     &o  Italic           &m  Strikethrough
#     &r  Reset (clears formatting)
#
#  PLACEHOLDERS
#  ──────────────────────────────────────────────────────────────────
#  You can use placeholders in messages that will be replaced automatically:
#     %player%   → the player who executed the command
#     %target%   → the target player (e.g. in /invsee)
#
# ╔════════════════════════════════════════════════════════════╗
# ║                         SETTINGS                           ║
# ╚════════════════════════════════════════════════════════════╝

# Command Output prefix
prefix: "&8[&aLowCore&8] &7" # leave a Space at the end

# Configure Join and Quit messages
join-quit-messages:
  enabled: true
  join: "&a+ &7%player%"
  quit: "&c- &7%player%"

# Configure the message of the Day
motd:
  enabled: true
  line-1: "&aLowCore"
  line-2: "&7Online: &a%online%&7/&a%max% &7| v%version%"

# General config messages
messages:
  reload: "&aLowCore config reloaded!"
  no-permission: "&cYou do not have permission!"
  player-only: "&cOnly players can use this command!"
  unknown-player: "&cThis player is not online."

# ======================
# Dimension Locks
# ======================
# When locked, players and entities cannot enter the dimension and new Nether
# portals cannot be activated. Leaving a locked dimension is always allowed.
# Operators can also use: /lowcore dimension <nether|end> <lock|unlock|status>
dimensions:
  nether-locked: false
  nether-unlock-at: 0
  end-locked: false
  end-unlock-at: 0
  gui:
    # Up to seven timer buttons are shown in the dimension settings menu.
    durations:
      - "15m"
      - "30m"
      - "1h"
      - "2h"
      - "6h"
      - "1d"
      - "7d"
  messages:
    locked: "&cThe %dimension% is currently locked."
    end-frame-blocked: "&cThe End is locked, so Ender Eyes cannot be inserted."
    usage: "&7Usage: &e/lowcore dimension <nether|end> <lock|unlock|status>"
    status: "&7The %dimension% is currently %status%&7."
    updated: "&7The %dimension% is now %status%&7."
    command-usage: "&7Usage: &e/lock-dimension <nether|end> [duration|lock|unlock|status]"
    invalid-duration: "&cInvalid duration. Use combinations such as &e30m&c, &e2h&c, &e1d12h&c (maximum 365d)."
    locked-permanent: "&cThe %dimension% is now locked permanently."
    locked-timed: "&cThe %dimension% is now locked for %duration%."
    unlocked: "&aThe %dimension% is now unlocked."
    status-open: "&aThe %dimension% is unlocked."
    status-permanent: "&cThe %dimension% is locked permanently."
    status-timed: "&cThe %dimension% is locked for another %duration%."
    auto-unlocked: "&aThe %dimension% lock expired and it is now open."

# ======================
# End Crystal Cooldown
# ======================
# Placement cooldown per player. 20 ticks are approximately one second.
# Set to 0 to disable it, or use /crystal-cooldown <ticks> in game.
crystal-cooldown:
  ticks: 0
  messages:
    usage: "&7Usage: &e/crystal-cooldown <ticks|off|status> &7(20 ticks = 1 second)"
    invalid: "&cEnter a whole number between 0 and 72000 ticks."
    updated: "&aCrystal placement cooldown set to &e%ticks% ticks&a."
    disabled: "&aCrystal placement cooldown disabled."
    status: "&7Crystal placement cooldown: &e%ticks% ticks &7(%seconds%s)"
    wait: "&cWait another &e%ticks% tick(s) &cbefore placing another Crystal."

# ======================
# Anti-Mod Detection
# ======================
# Uses Paper's virtual sign API and client-side translation/keybind resolution.
# This detects known client resources, not whether a cheat was actively used.
# Failed, blocked or timed-out probes never trigger punishment.
anti-mods:
  migrated: true
  enabled: false
  punishment: "kick" # notify, kick or ban
  # Start shortly after login, while the player is normally still loading terrain.
  join-delay-ticks: 10
  loading-screen-migrated: true
  invisible-probe-migrated: true
  # Retry once if the login/chunk packets swallowed the first virtual-sign probe.
  join-attempts: 2
  join-retry-delay-ticks: 10
  close-delay-ticks: 1
  confirmation-delay-ticks: 2
  timeout-ticks: 40
  double-check: true
  clients:
    freecam:
      blocked: true
    meteor:
      blocked: true
    wurst:
      blocked: true
    liquidbounce:
      blocked: true
    thunderhack:
      blocked: true
  bypass:
    ops: true
    permission: "lowcore.antimods.bypass"
  logs:
    # 36 entries are stored per page. Options in the GUI: 1, 3, 5, 10 or 20.
    max-pages: 5
  # Fallback for proxy setups where the Geyser/Floodgate API is unavailable.
  bedrock-name-prefixes:
    - "."
    - "*"
  messages:
    usage: "&7Usage: &e/anti-mods [gui|on|off|status|punishment|check|logs|allow|block|bypass-permission]"
    enabled: "&aAnti-Mod detection enabled. Joining players will be checked."
    disabled: "&eAnti-Mod detection disabled."
    status: "&7Anti-Mods: %status%&7, punishment: &e%punishment%&7."
    punishment-usage: "&7Usage: &e/anti-mods punishment <notify|kick|ban>"
    punishment-updated: "&aAnti-Mod punishment set to &e%punishment%&a."
    client-usage: "&7Usage: &e/anti-mods <allow|block> <client>"
    unknown-client: "&cUnknown Anti-Mod client: &e%client%"
    client-blocked: "&c%client% &7is now blocked."
    client-allowed: "&a%client% &7is now allowed and will only be logged."
    bypass-permission-usage: "&7Usage: &e/anti-mods bypass-permission <permission|off>"
    bypass-permission-updated: "&aAnti-Mod bypass permission set to &e%permission%&a."
    check-usage: "&7Usage: &e/anti-mods check <player>"
    check-started: "&7Started an Anti-Mod check for &e%player%&7."
    already-running: "&e%player% &7is already being checked."
    bypassed: "&e%player% &7has an Anti-Mod bypass."
    bedrock-skipped: "&e%player% &7is connected through Geyser/Floodgate and was not checked."
    failed: "&cThe Anti-Mod check for &e%player% &ccould not be started."
    confirming: "&e%player% &7matched &e%mods%&7. Running confirmation check..."
    clean: "&aNo configured mod signatures detected for &e%player%&a."
    allowed-detected: "&aAllowed client &e%mods% &adetected for &e%player%&a; no punishment applied."
    protected: "&e%player% returned a protected/filtered sign response. No punishment was applied."
    timeout: "&eThe check for %player% timed out. No punishment was applied."
    inconclusive: "&eThe confirmation check for %player% was inconclusive. No punishment was applied."
    detected: "&cDetected &e%mods% &con &e%player%&c."
    kick-reason: "&cDisallowed client modification detected: &e%mods%"
    logs-cleared: "&aDeleted &e%count% &aAnti-Mod log entries."

# ======================
# Secret Trial Chamber Drops
# ======================
# Items listed here are removed only from Trial Chamber loot tables.
# The same materials can still be obtained normally everywhere else.
trial-drops:
  enabled: true
  disabled-items:
    - HEAVY_CORE
  messages:
    usage: "&7Usage: &e/trial-drops [on|off|status|enable <item>|disable <item>|toggle <item>]"
    player-only: "&cOnly players can open the Trial Drops GUI."
    enabled: "&aTrial Chamber drop filtering enabled."
    disabled: "&eTrial Chamber drop filtering disabled."
    status: "&7Trial Chamber drop filtering is %status%&7. Blocked items: &e%count%&7."
    invalid-item: "&cUnknown or invalid item: &e%item%"
    item-blocked: "&c%item% &7will no longer drop inside Trial Chambers."
    item-allowed: "&a%item% &7can drop inside Trial Chambers again."

