name: LowCore
version: '${project.version}'
main: dev.jalikdev.lowCore.LowCore
api-version: '26.2'
author: 'jan'
softdepend: [Geyser-Spigot, floodgate]

commands:

  lowcore:
    description: Main command for LowCore
    usage: /lowcore
    permission: lowcore.command
    aliases: [lc]

  lock-dimension:
    description: Lock the Nether or End permanently or for a set duration
    usage: /lock-dimension <nether|end> [duration|lock|unlock|status]
    permission: lowcore.dimensions

  crystal-cooldown:
    description: Configure the per-player End Crystal placement cooldown
    usage: /crystal-cooldown <ticks|off|status>
    permission: lowcore.crystal-cooldown
    aliases: [ccd]

  anti-mods:
    description: Configure translation-key based client mod detection
    usage: /anti-mods [on|off|toggle|status|punishment|command|check|logs|allow|block|bypass-permission]
    permission: lowcore.antimods.admin
    aliases: [am]

  trial-drops:
    description: Secret Trial Chamber drop controls
    usage: /trial-drops [on|off|status|enable|disable|toggle]
    permission: lowcore.trial-drops.admin
    aliases: [vaultdrops]

  fly:
    description: Toggles flight
    usage: /fly
    permission: lowcore.fly

  gm:
    description: Changes gamemode
    usage: /gm
    permission: lowcore.gm
    aliases: [gamemode]

  ec:
    description: Open your ender chest or another player's
    usage: /ec [player]
    permission: lowcore.ec
    aliases: [enderchest]

  invsee:
    description: View another player's inventory
    usage: /invsee <player>
    permission: lowcore.invsee

  hat:
    description: Put the item in your hand on your head
    usage: /hat [player]
    permission: lowcore.hat
    aliases: [head]

  heal:
    description: Heal yourself or others
    usage: /heal [player]
    permission: lowcore.heal

  feed:
    description: Feed yourself or others
    usage: /feed [player]
    permission: lowcore.feed

  spawnmob:
    description: Spawn a Mob
    usage: /spawnmob <mob> [amount]
    permission: lowcore.spawnmob
    aliases: [spawnentity, summonmob]

  enchant:
    description: Enchant and modify items
    usage: /enchant <...>
    permission: lowcore.enchant

  anvil:
    description: Opens an anvil interface
    usage: /anvil
    permission: lowcore.anvil

  repair:
    description: Repairs your held item or all items
    usage: /repair [all]
    permission: lowcore.repair

  craft:
    description: Opens a crafting table
    usage: /craft
    permission: lowcore.craft
    aliases: [workbench]

  vanish:
    description: Toggle vanish mode
    usage: /vanish
    permission: lowcore.vanish
    aliases: [v]

  speed:
    description: Change your walk or fly speed
    usage: /speed <1-10>
    permission: lowcore.speed

  god:
    description: Toggle god mode
    usage: /god
    permission: lowcore.god
    aliases: [invincibility]

  killall:
    description: Kill mobs globally or in a radius
    usage: /killall [type] [radius]
    permission: lowcore.killall
    aliases: [killmob]

  log:
    description: View recent admin actions
    usage: /log [amount]
    permission: lowcore.log

  cleanup:
    description: Open the lag cleanup GUI
    usage: /cleanup
    permission: lowcore.cleanup
    aliases: [ lag, clearlag ]

  performance:
    description: Show server performance
    usage: /performance
    permission: lowcore.performance
    aliases: [perf, tps]

  sudo:
    description: Execute a command or send a message as another player
    usage: /sudo <player> <command or message>
    permission: lowcore.sudo
    permission-message: §cYou do not have permission to use this command.

  lastlogout:
    description: Shows the last logout location of a player
    usage: "/lastlogout <player>"
    permission: lowcore.lastlogout

  lowcoreadmin:
    description: LowCore admin/settings command
    usage: /lowcoreadmin
    permission: lowcore.admin
    aliases: [ lca ]

  nightvision:
    description: Toggle hidden fullbright night vision
    usage: /nightvision
    aliases: [ nv, fullbright ]
    permission: lowcore.nightvision

  sit:
    description: Sit down / stand up
    usage: /sit
    permission: lowcore.sit

permissions:

  lowcore.command:
    description: Use /lowcore
    default: op

  lowcore.reload:
    description: Reload the LowCore configuration
    default: op

  lowcore.dimensions:
    description: Lock, unlock and inspect dimensions
    default: op

  lowcore.dimensions.bypass:
    description: Enter dimensions even while they are locked
    default: false

  lowcore.crystal-cooldown:
    description: Configure the End Crystal placement cooldown
    default: op

  lowcore.crystal-cooldown.bypass:
    description: Bypass the End Crystal placement cooldown
    default: false

  lowcore.antimods.admin:
    description: Configure Anti-Mods and manually check players
    default: op

  lowcore.antimods.alerts:
    description: Receive Anti-Mod detection alerts
    default: op

  lowcore.antimods.bypass:
    description: Skip automatic and manual Anti-Mod probes
    default: false

  lowcore.trial-drops.admin:
    description: Configure secret Trial Chamber loot filters
    default: op

  lowcore.log:
    description: View and clear the persistent admin audit log
    default: op

  lowcore.fly:
    description: Use /fly
    default: op

  lowcore.gm:
    description: Use /gm
    default: op

  lowcore.craft:
    description: Open Crafting
    default: op
  lowcore.craft.others:
    description: Open Crafting for others
    default: op

  lowcore.anvil:
    description: Open Anvil
    default: op
  lowcore.anvil.others:
    description: Open a Anvil for others
    default: op

  lowcore.ec:
    description: Open your ender chest
    default: op
  lowcore.ec.others:
    description: Open others' ender chests
    default: op

  lowcore.invsee:
    description: View inventories
    default: op
  lowcore.invsee.edit:
    description: Edit inventories opened with /invsee
    default: op

  lowcore.hat:
    description: Use /hat on yourself
    default: true
  lowcore.hat.others:
    description: Use /hat on others
    default: op

  lowcore.heal:
    description: Heal yourself
    default: op
  lowcore.heal.others:
    description: Heal others
    default: op

  lowcore.feed:
    description: Feed yourself
    default: op
  lowcore.feed.others:
    description: Feed others
    default: op

  lowcore.spawnmob:
    description: Spawn mobs
    default: op
  lowcore.spawnmob.restricted:
    description: Spawn mobs listed as restricted
    default: op

  lowcore.enchant:
    description: Enchant items
    default: op
  lowcore.enchant.clear:
    description: Clear item enchantments
    default: op
  lowcore.enchant.remove:
    description: Remove individual item enchantments
    default: op
  lowcore.enchant.name:
    description: Rename items
    default: op
  lowcore.enchant.bypass:
    description: Use unsafe enchantments and levels
    default: op

  lowcore.repair:
    description: Repair held items or the full inventory
    default: op

  lowcore.vanish:
    description: Toggle vanish mode
    default: op

  lowcore.speed:
    description: Change walk and flight speed
    default: op

  lowcore.god:
    description: Toggle god mode
    default: op
  lowcore.god.others:
    description: Toggle god mode for other players
    default: op

  lowcore.killall:
    description: Remove mobs by group, type or radius
    default: op

  lowcore.performance:
    description: Use /performance
    default: op
  lowcore.performance.notify:
    description: Receive automatic performance warnings
    default: op

  lowcore.cleanup:
    description: Use the lag cleanup GUI
    default: op

  lowcore.sudo:
    description: Make someone say something
    default: op
  lowcore.sudo.op:
    description: All sudo permissions!
    default: op

  lowcore.lastlogout:
    description: Allows the use of /lastlogout
    default: op

  lowcore.admin:
    description: Allows using the LowCore admin/settings command
    default: op

  lowcore.nightvision:
    description: Allows using /nightvision
    default: op

  lowcore.update:
    description: Receive update notifications when joining
    default: op

  lowcore.sit:
    default: true
